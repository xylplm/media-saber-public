user msaber;
worker_processes auto;
worker_cpu_affinity auto;

error_log /app/config/nginx/log/error.log warn;

events {
    worker_connections 1024;
}


http {

    include /etc/nginx/mime.types;
    client_max_body_size 200m;
    default_type application/octet-stream;

    # 设置缓存路径和缓存区大小
    proxy_cache_path /tmp levels=1:2 keys_zone=my_cache:10m max_size=100m inactive=60m use_temp_path=off;

    # 速率限制区域，用于防止滥用
    limit_req_zone $binary_remote_addr zone=m3u8_proxy:10m rate=10r/m;

    sendfile on;

    keepalive_timeout 3600;

    #log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    #                '$status $body_bytes_sent "$http_referer" '
     #               '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log /app/config/nginx/log/access.log main;

    
    #默认关闭访问日志
    access_log off;

    server {


        listen ${MS_PORT};
        listen [::]:${MS_PORT};
        server_name _; # serve all hostnames
        server_tokens off; # disable header "Server nginx"

        # gzip compression
        gzip on;
        gzip_comp_level 6;
        gzip_min_length 1100;
        gzip_buffers 16 8k;
        gzip_proxied any;
        gzip_types
            application/javascript
            application/json
            application/rss+xml
            application/x-javascript
            application/xml
            image/svg+xml
            text/css
            text/javascript
            text/js
            text/plain
            text/xml;

        location / {
            # 主目录
            expires off;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            root /app/front;
            try_files $uri $uri/ /index.html =404;
            index index.html;
        }

        location ~* \.(js|css|ico|svg)$ {
            # 缓存根目录下的 JS、CSS、ICO 和 SVG 文件
            expires 30d;
            add_header Cache-Control "public";
            root /app/front;
        }

        location /assets {
            # 静态资源
            expires 30d;
            add_header Cache-Control "public";
            root /app/front;
        }

        location /static {
             # 静态资源
            expires 30d;
            add_header Cache-Control "public";
            root /app/config/data;
        }

        location /message {
            # /message  MCP 接口 - 防止host拦截单独配置 Host 头
            keepalive_timeout 0;
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_redirect off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host 127.0.0.1:22698;
            proxy_set_header Connection keep-alive;
            add_header Cache-Control no-cache;
            add_header Content-Type text/event-stream;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 已注册的 SSE 端点统一复用长连接配置，普通 API 继续落入下方通用 /api 代理。
        location ~ ^/(api/v1/agent/chat/stream|api/v1/eventMessage/event|api/v1/subtitle/events|api/v1/system/health/scan|ai/v1/chat/completions|ai/v1/diagnosis/log/stream)$ {

            # 针对 SSE (Server-Sent Events) 的特殊处理。
            # 正则仅匹配已注册的流式端点，保持连接不超时。
            keepalive_timeout 0; # 永不超时

            # 针对 text/event-stream 请求永不超时
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_redirect off;
            proxy_set_header X-Accel-Buffering no;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;

            # 设置为长连接
            proxy_set_header Connection keep-alive;

            # 针对 SSE (Server-Sent Events)
            add_header Cache-Control no-cache;
            add_header Content-Type text/event-stream;

            # 增加以下超时设置为 24 小时
            proxy_read_timeout 86400s; # 读取超时时间
            proxy_send_timeout 86400s; # 发送超时时间
        }

        location /ai {
            # AI相关请求
            # 后端API
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_redirect off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
        }

        # 玻璃主题必应壁纸（全站共用、无鉴权）；local 走 /static/wallpaper 30d
        # 必须写在 /api 之前；按 URI 缓存即可（无用户维度）
        location ^~ /api/v1/system/wallpaper {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_buffering on;
            proxy_cache my_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_key $scheme$proxy_host$request_uri;
            proxy_cache_valid 200 1d;
            proxy_cache_valid 204 1m;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_hide_header Set-Cookie;
            proxy_ignore_headers Set-Cookie Cache-Control Expires;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control $upstream_http_cache_control always;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location /api {
            # 后端API
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_redirect off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
        }

    }

    upstream backend_api {
        # 后端API的地址和端口
        server 127.0.0.1:22698;
        # 可以添加更多后端服务器作为负载均衡
    }

    #加载自定义配置
    include /app/config/nginx/vhost/*.conf;


}
